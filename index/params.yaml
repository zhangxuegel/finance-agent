# ============================================================================
# T-Fin01 核心台账 —— 本金 / 费率 / 策略 / 风控 参数（唯一真源）
# 任何脚本要用这些参数只能从这里读；新增参数必须登记"来源"，
# 来源不明的参数视为幻觉数据，禁止使用。
# ============================================================================

account:
  initial_capital: 1000000     # 模拟盘初始资金（元）。铁律：禁止接实盘
  currency: CNY

fees:
  # 来源：A 股 ETF 券商公开费率惯例（万分之0.5~3 不等），取保守值万一2
  commission_bps: 2            # 买卖双边的佣金，万分之二（0.02%）
  commission_min: 5.0          # 单笔最低佣金（元）
  # 来源：财放税规——场内 ETF 交易免征印花税；股票为卖出千分之一
  stamp_duty_bps: 0            # ETF 卖出印花税=0；若改做个股须改 100
  # 来源：买卖价差与冲击成本的经验预估（保守取万一）
  slippage_bps: 1              # 撮合时按方向不利侧外加的滑点

trading_rule:
  settle: next_open            # 信号日收盘生成指令 → 次日开盘价撮合
  lot: 100                     # A 股整手（100 股/手）

strategy:
  # engine: A = 双均线趋势追踪；B = 布林带均值回归
  engine: A
  A:
    ma_fast: 8                 # 快均线周期（网格搜索最优：8/30）
    ma_slow: 30                # 慢均线周期（网格搜索最优：8/30）
    # ---- 大盘过滤（新增）----
    benchmark_filter: false     # 已锁定 false：大盘过滤未启用（见下方对比报告）
    benchmark_code: "510300"   # 大盘基准代码（沪深300ETF）
    benchmark_ma: 20           # 大盘基准均线周期（MA20）
  B:
    window: 20                 # 布林带均线窗口
    n_std: 2.0                 # 标准差倍数
    exit: mid                  # 触中轨离场（可选 "mid"）

# ============================================================================
# T-Fin 选股过滤模块（新增）
# 所有阈值均在此登记，screener.py 中禁止硬编码任何数字
# ============================================================================
screener:
  enable: false                   # 已封存：仅作盘前参考，不挂钩交易引擎
  select_count: 3                 # 每日选股数量（上限）
  # 候选股票池：screener 从此池中筛选，所有代码须在 watchlist 中有真实行情数据
  candidate_pool:
    - code: "510300"
      name: 沪深300ETF
      secid: "1.510300"
      kind: etf
    - code: "159915"
      name: 创业板ETF
      secid: "0.159915"
      kind: etf
    - code: "513500"
      name: 标普500ETF(QDII)
      secid: "1.513500"
      kind: etf
    - code: "518880"
      name: 黄金ETF
      secid: "1.518880"
      kind: etf
    - code: "510880"
      name: 上证红利ETF(华泰柏瑞)
      secid: "1.510880"
      kind: etf
  # ---- 筛选阈值（全部登记，禁止代码写死）----
  volume_ratio_threshold: 1.5     # 量能极值：当日成交额 / 过去20日均额 > 1.5
  roc_threshold: 0.08             # 强趋势：过去10日涨幅(ROC) > 8%
  bull_volume_ratio_threshold: 0.50  # 强承接：过去20日阳线成交量占比 > 50%
  lookback_days: 20               # 量能/承接回看窗口（20日）
  roc_days: 10                    # 涨幅回看窗口（10日）
  ma_fast: 5                      # 趋势判定：MA5
  ma_mid: 10                      # 趋势判定：MA10
  ma_slow: 20                     # 趋势判定：MA20

# T-Fin27 登记区块（2026-10-21）：分红与开局锚点 —— audit_fill_time_lock 口径自洽所需
dividends:
  # 现金分红台账（每股派现）。来源：东方财富基金分红公告页 fhsp（2026-10-21 在线核验）。
  # 维护规则：标的每次除息须人工在此登记，audit 会以 raw = qfq + Σ{除息日>d} 每股分红
  # 反推不复权口径——未登记的新除息会令审计报"价格不符"（这是特性：提醒补台账）。
  "510300":
    - {ex_date: 2024-01-18, per_share: 0.069}
    - {ex_date: 2025-06-18, per_share: 0.088}
    - {ex_date: 2026-01-19, per_share: 0.123}
  # ---- T-Fin28 登记（2026-10-21）：510880 红利ETF 防守腿入场，同口径登记 ----
  # 来源：东财 fundf10 fhsp_510880 分红送配详情页（2026-10-21 在线核验）
  "510880":
    - {ex_date: 2017-01-23, per_share: 0.091}
    - {ex_date: 2018-01-23, per_share: 0.109}
    - {ex_date: 2019-01-16, per_share: 0.098}
    - {ex_date: 2020-01-17, per_share: 0.144}
    - {ex_date: 2021-01-18, per_share: 0.141}
    - {ex_date: 2022-01-17, per_share: 0.086}
    - {ex_date: 2023-01-16, per_share: 0.138}
    - {ex_date: 2024-01-23, per_share: 0.131}
    - {ex_date: 2025-01-21, per_share: 0.142}
    - {ex_date: 2026-01-21, per_share: 0.143}
anchor:
  # 回测起点锚定建仓（T-Fin01 设计：账本首日按目标等权建仓，不经过信号日收盘机制，
  # 亦不依赖未来价格）。audit_fill_time_lock 仅对该日 BUY 豁免"前一日信号"校验。
  date: "2023-11-17"

series:
  # ---- T-Fin33 登记（业主拍板 a）：信号/撮合口径的数据窗口起点 ----
  # 来源：git e6f93c9 台账孕育证据——当年腾讯 raw CSV 首行=2023-10-20；
  # 2026-10-21 大重抓被截到 2023-10-25（缺 5 根）→ MA20 成熟点后移，
  # warmup 期 sig=0 引擎在 11-20 全仓卖出——重放与真账分歧 185/186 笔的根因。
  # 引擎窗口必须与孕育期逐根一致：多一天/少一天都会移位 MA 成熟点与交叉判定。
  from: "2023-10-20"

positions:
  # 目标权重：持仓时等权分配，1/n_assets（由脚本按 watchlist 求倒数）
  target_weight: 0.25          # 登记参考值 = 1 / 当前资产数（watchlist）

risk:
  # 两条绝对熔断规则（任何脚本不得修改或绕过）
  daily_loss_cutoff: 0.03      # 单日净值亏损 > 3% → 强制清仓
  max_drawdown_cutoff: 0.10    # 净值自最高点回撤 > 10% → 强制清仓
  lock_days: 3                 # 熔断后锁仓 3 个交易日（禁止一切买卖）

benchmark:
  code: "510300"
  secid: "1.510300"
  name: 沪深300ETF（业绩基准）

llm:
  # LLM 只做复盘分析（策略分析师/风控官），不参与任何买卖决策
  base_url: https://open.bigmodel.cn/api/paas/v4
  model: glm-4-flash
  api_key_env: GLM_API_KEY     # 无此环境变量时,报告自动降级为"规则点评"

stress:
  # ---- T-Fin02 新增（登记台账）----
  # 高滑点地狱模式：滑点×N 倍重放全历史，检验流动性冲击下策略生存能力
  slippage_multiplier: 10
  # 防未来函数审计的探针日数量（截断重算法抽样密度）
  lookahead_probes: 40

ensemble:
  # ---- T-Fin03 新增（登记台账）----
  A:
    ma_fast: 20                # 任务书：MA20 上穿 MA60
    ma_slow: 60
  B:
    rsi_period: 14             # RSI14 < 30 买 / > 70 卖
    rsi_buy: 30
    rsi_sell: 70
  # ---- T-Fin28 新增（2026-10-21 业主指令）：D 震荡网格腿 / E 防守红利腿 ----
  D:
    anchor_window: 120         # 网格基线 MA120（确定性，只用 ≤i 收盘）
    step_pct: 0.03             # 单格步长 3%：跌破基线×0.97 建仓；站上格点×1.03 清仓
    yellow_ok: true            # T-Fin28 分腿防守矩阵：黄灯=纠缠震荡期=网格用武之地，
                               # 放行 D 腿交易（红灯/急跌门仍清仓+禁买；trade 打 grid_yellow 标记）
  E:
    code: "510880"             # 防守红利腿单标的（.Utilities: 上证红利ETF）
    secid: "1.510880"
    name: 上证红利ETF(华泰柏瑞)
    defensive: true            # [状态机豁免位] 黄/红灯不强清，按自身公式交易
    ma_window: 60              # 自身公式：close ≥ 自身 MA60 持有，否则空仓
  C:
    code: "511990"             # 货币 ETF（银华日利），黄/红灯或 A/B 双空仓时承接资金
    secid: "1.511990"
    name: 银华日利货币ETF
  race:
    lookback: 20               # 每周末用过去 20 个交易日各策略夏普赛马
    enable: true               # T-Fin28 登记：false 时冻结赛马（权重=init_weights），
                               # 仅用于独立策略单跑（race_compare 专用，禁作实盘配置）
    init_weights: {A: 0.30, B: 0.25, D: 0.25, E: 0.20}   # 热身期/独立单跑的固定分权
    shares: {t1: 0.35, t2: 0.30, t3: 0.20, t4: 0.15}     # T-Fin28：夏普排名 t1..t4 目标位
    # legacy（T-Fin03 2 腿口径，race_weights/optimizer 网格仍引用；T-Fin28 起
    # 实盘由 shares 分位驱动，以下键仅作回放旧台账与寻优网格兼容位）：
    winner_share: 0.7          # 胜者 7 / 败者 3
    loser_share: 0.3
    max_weekly_shift: 0.2      # 平滑防过拟合：单周单腿漂移上限 ±20pp（禁 0→100%）
    min_weight: 0.10           # T-Fin28：单腿权重下限（防守腿 E 另有 def_floor）
    def_floor: 0.15            # T-Fin28：防守腿 E 的更高地板（防守永不清零）
  tilt:
    score_high: 80             # LLM 市场信心 >80 → 策略 A 加权
    a_tilt_pp: 0.05
    score_low: 20              # <20 → 策略 C（货币腿）加权
    c_tilt_pp: 0.10
    warmup_fixed_share: 0.5    # 赛马数据未满 20 日前固定 5:5
  crash_gate:                  # ---- T-Fin04 急跌熔断门（台账登记）----
    enable: true
    drop_threshold: 0.02       # 基准最近收一笔收盘单日 ≤ -2%（次日开盘起全面防守）
    hold_days: 3               # 至少防守 3 个交易日；再遇 ≤-2% 重新计时
    # 退出条件：灯回绿 且 近5日无 ≤-drop 急跌（反绿闪，防崩盘期重复进场）
    reentry_days: 10            # 防守解除后的回稳观察期
    reentry_damp: 0.5           # 观察期内买入预算减半（衰减进场）
    reentry_ratio: 0.99         # 复进门槛（基准+逐资产）：收盘 ≥ 60日高点×0.99；不达标继续防守

push:
  webhook_url_env: FIN_PUSH_URL # 真实群 URL 仅从环境变量读；本地/测试一律走 loopback mock
  allow_remote_env: FIN_PUSH_ALLOW

cron:
  # ---- T-Fin34 改版（业主 2026-10-24 拍板：云端为主线、本地对帐落库）----
  # 云端主线：GitHub Actions daily_close（北京 15:50）——单写者。
  # 本地错峰：交易日 16:40 拉取+对帐；仅云端缺日才本地灾备落库。
  schedule: "40 16 * * 1-5"     # 本地对帐闸错峰（晚于云端 15:50）
  # morning_schedule "0 8 * * 1-5"（T-Fin04 晨报）：登记保留，两版 crontab 均未装载——
  # 云端主线版（T-Fin34）不排晨报；如需启用须同时登 crontab 与 runner 改造。
  weekly_report: "0 9 * * 6"    # 周六 9:00 周末引擎（optimizer 网格+OOS 拦截）
  runner: scripts/run_daily_all.sh

factor:
  # ---- T-Fin03 新增（登记台账）----
  momentum_window: 20           # 动量 = 近20日涨幅
  atr_period: 14                # 波动率 = ATR14（Wilder）
  rsi_window: 14                # T-Fin28：强弱因子 = RSI14（Wilder，与 B 腿同源公式）
  # T-Fin28 辅助过滤立场（rule_score 内实现，语义见其 docstring）：
  # RSI 过热助推/超卖折价；高 ATR% 仅在下跌动量时罚分（上行 breakout 不罚）。
  # 估值因子替代口径声明：ETF 无市盈率台账，禁用幻觉 PE。
  # 用基准收盘价在近 250 日中的分位（0~1）替代，来源=行情 CSV 确定性计算。
  valuation_window: 250
  news_max: 12                  # 每次喂给 GLM 的新闻条数上限（新浪财经快讯，免Token）

# ===================== T-Fin05 影子实盘（登记台账） =====================
live:
  data_dir: data/live          # 影子台账 CSV（=正式台账 CSV + 逐日真实 EOD 增量）
  db: data/shadow_live.db      # sqlite3：fills/eod/events 三表
  state: data/shadow_state.json
  max_quote_delay_sec: 180     # 心跳红线：行情时戳延迟 >180s → 报警+当日降级
  heartbeat_times: ["09:25", "14:55"]
  benchmark_index: sh000300    # 沪深300 指数（东财 secid 1.000300）；Alpha 基准
  monitor:
    bench_drop: -0.02          # 指数盘中 ≤ -2% → 立即紧急 webhook（不等收盘）
    rearm_pct: -0.01           # 滞回：回升 ≥ -1% 才重新武装报警
    interval_sec: 300          # 09:30-15:00 每 5 分钟一轮
  schedule:
    plan_push: "45 8 * * 1-5"       # 08:45 预案推送
    match: "30 9 * * 1-5"           # 09:30 开盘撮合（真实时价）
    ledger: "5 15 * * 1-5"          # 15:05 收盘落库（真实 EOD）
    review_push: "10 15 * * 1-5"    # 15:10 成交复盘推送
  limit_down_rule: "开盘价 ≤ 昨收×0.90(+0.002 容差) → 当日禁买该标的（不伪造流动性）"
  dashboard_port: 8501         # T-Fin06：本地看板端口（Flask http://127.0.0.1:8501）
  aggregate_schedule: "15 15 * * 1-5"  # 15:15 连续追踪聚合+胜率热力图
  kill_switch_flag: PANIC_LOCK.flag    # 人工干预物理开关的红旗文件（根目录）
